spring.application.name=electronicStore

spring.datasource.url=jdbc:mysql://localhost:3307/ElectronicStore?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=test
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect



#config path
user.profile.image.path=./uploads/users
category.profile.image.path = ./uploads/category
# OR for development
#user.profile.image.path=/tmp/uploads/users

#custom file size
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
