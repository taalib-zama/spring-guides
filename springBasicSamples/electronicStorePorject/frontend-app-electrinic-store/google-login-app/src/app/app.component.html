<div class="min-h-screen bg-gradient-to-br from-blue-900 via-purple-900 to-indigo-900 flex items-center justify-center p-4">
  @if(user) {
  <!-- User Dashboard -->
  <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full text-center">
    <div class="mb-6">
      <img [src]="user.user.imageName" class="w-24 h-24 rounded-full mx-auto border-4 border-purple-500 shadow-lg" alt="User" />
    </div>
    <h2 class="text-2xl font-bold text-gray-800 mb-2">Welcome Back!</h2>
    <p class="text-xl text-gray-700 mb-1">{{ user.user.name }}</p>
    <p class="text-gray-500 mb-6">{{ user.user.email }}</p>
    <button class="bg-red-500 hover:bg-red-600 text-white font-semibold py-2 px-6 rounded-lg transition duration-300">
      Sign Out
    </button>
  </div>
  } @else {
  <!-- Login Page -->
  <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full">
    <!-- Icon & Title -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-20 h-20 bg-gradient-to-br from-purple-500 to-blue-600 rounded-2xl mb-4 shadow-lg">
        <svg class="w-12 h-12 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path>
        </svg>
      </div>
      <h1 class="text-3xl font-bold text-gray-800 mb-2">Electronic Store</h1>
      <p class="text-gray-600">Sign in to access your account</p>
    </div>

    <!-- Divider -->
    <div class="mb-6">
      <div class="relative">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-gray-300"></div>
        </div>
        <div class="relative flex justify-center text-sm">
          <span class="px-4 bg-white text-gray-500">Continue with</span>
        </div>
      </div>
    </div>

    <!-- Google Sign In Button -->
    <div class="flex justify-center">
      <asl-google-signin-button
        type="standard"
        size="large"
        text="signin_with"
      ></asl-google-signin-button>
    </div>

    <!-- Footer -->
    <div class="mt-8 text-center text-sm text-gray-500">
      <p>By signing in, you agree to our Terms of Service and Privacy Policy</p>
    </div>
  </div>
  }
</div>
